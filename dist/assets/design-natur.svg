<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060"><rect width="1000" height="1060" fill="#f5f4eb"/><text x="48" y="55" font-family="Arial" font-size="21" fill="#344c3a" letter-spacing="4">RAUMWERK</text><text x="570" y="55" font-family="Arial" font-size="14" fill="#344c3a" >Philosophie      Räume      Gemeinsam starten ↗</text><svg x="0" y="92" width="510" height="565" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid slice"><rect x="0" y="0" width="600" height="460" fill="#dce2cf" rx="0"/><circle cx="465" cy="95" r="44" fill="#fff" opacity=".45"/><path d="M0 310 Q180 200 320 330 T600 300 V460 H0Z" fill="#abb59a"/><path d="M95 170 365 112 520 182 255 246Z" fill="#e2dec9"/><path d="M95 170 255 246 V397 L95 319Z" fill="#a8ad91"/><path d="M255 246 520 182 V342 L255 397Z" fill="#e2dec9"/><path d="M278 263 491 211 V324 L278 373Z" fill="#3c4b3b"/><path d="M290 269 480 223 V314 L290 357Z" fill="#8dada9" opacity=".35"/><path d="M310 257 V354" stroke="#e2dec9" stroke-width="6"/><path d="M350 257 V354" stroke="#e2dec9" stroke-width="6"/><path d="M390 257 V354" stroke="#e2dec9" stroke-width="6"/><path d="M430 257 V354" stroke="#e2dec9" stroke-width="6"/><path d="M470 257 V354" stroke="#e2dec9" stroke-width="6"/><path d="M110 190 235 249 V351 L110 294Z" fill="#3c4b3b"/><path d="M0 422 230 382 340 460 H0Z" fill="#eee7d8" opacity=".6"/><path d="M555 370V198" stroke="#59634d" stroke-width="9"/><ellipse cx="553" cy="188" rx="39" ry="76" fill="#68745b"/><ellipse cx="45" cy="318" rx="55" ry="19" fill="#778265"/></svg><rect x="510" y="92" width="490" height="565" fill="#dce3ce" rx="0"/><text x="552" y="150" font-family="Arial" font-size="11" fill="#344c3a" letter-spacing="2">MIT DER NATUR GEDACHT</text><text x="550" y="255" font-family="Georgia" font-size="70" fill="#344c3a" >Natürlich</text><text x="550" y="330" font-family="Georgia" font-size="70" fill="#344c3a" >Raum</text><text x="550" y="405" font-family="Georgia" font-size="70" fill="#344c3a" >zum Leben</text><text x="554" y="472" font-family="Arial" font-size="16" fill="#344c3a" >Ehrliche Materialien. Langlebige Räume.</text><text x="554" y="502" font-family="Arial" font-size="16" fill="#344c3a" >Für Menschen, die bewusst wohnen.</text><rect x="554" y="547" width="208" height="48" fill="#344c3a" rx="0"/><text x="573" y="577" font-family="Arial" font-size="13" fill="#fff" >Unsere Haltung entdecken ↗</text><text x="48" y="732" font-family="Georgia" font-size="41" fill="#344c3a" >Weniger verbrauchen. Mehr bewahren.</text><text x="48" y="782" font-family="Arial" font-size="18" fill="#344c3a" >Wir planen mit Respekt für den Ort, das Material und die Menschen.</text><rect x="48" y="845" width="270" height="1" fill="#9aa88f" rx="0"/><text x="48" y="895" font-family="Arial" font-size="16" fill="#65795f" >01</text><text x="48" y="943" font-family="Georgia" font-size="29" fill="#344c3a" >Zuhören</text><text x="48" y="982" font-family="Arial" font-size="14" fill="#344c3a" >Was macht deinen Alltag aus?</text><rect x="365" y="845" width="270" height="1" fill="#9aa88f" rx="0"/><text x="365" y="895" font-family="Arial" font-size="16" fill="#65795f" >02</text><text x="365" y="943" font-family="Georgia" font-size="29" fill="#344c3a" >Weiterdenken</text><text x="365" y="982" font-family="Arial" font-size="14" fill="#344c3a" >Was steckt schon im Bestand?</text><rect x="682" y="845" width="270" height="1" fill="#9aa88f" rx="0"/><text x="682" y="895" font-family="Arial" font-size="16" fill="#65795f" >03</text><text x="682" y="943" font-family="Georgia" font-size="29" fill="#344c3a" >Bewusst bauen</text><text x="682" y="982" font-family="Arial" font-size="14" fill="#344c3a" >Was soll langfristig bleiben?</text></svg>