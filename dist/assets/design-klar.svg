<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060"><rect width="1000" height="1060" fill="#f7f7f1"/><text x="48" y="55" font-family="Arial" font-size="23" fill="#242824" font-weight="700">RAUM / WERK</text><text x="590" y="55" font-family="Arial" font-size="15" fill="#242824" >Projekte      Haltung      Kontakt ↗</text><text x="48" y="125" font-family="Arial" font-size="12" fill="#242824" letter-spacing="2">ARCHITEKTUR MIT KLAREM GEDANKEN</text><text x="42" y="226" font-family="Arial" font-size="112" fill="#242824" font-weight="700" letter-spacing="-7">Raum für</text><text x="42" y="335" font-family="Arial" font-size="112" fill="#242824" font-weight="700" letter-spacing="-7">das Wesentliche</text><text x="52" y="387" font-family="Arial" font-size="17" fill="#242824" >Wir entwerfen Orte, die bleiben. Reduziert in der Form, reich im Alltag.</text><svg x="0" y="430" width="1000" height="390" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid slice"><rect x="0" y="0" width="600" height="460" fill="#dce5e6" rx="0"/><circle cx="465" cy="95" r="44" fill="#fff" opacity=".45"/><path d="M0 310 Q180 200 320 330 T600 300 V460 H0Z" fill="#c0c4ad"/><path d="M95 170 365 112 520 182 255 246Z" fill="#e5d7bf"/><path d="M95 170 255 246 V397 L95 319Z" fill="#b5a88f"/><path d="M255 246 520 182 V342 L255 397Z" fill="#e5d7bf"/><path d="M278 263 491 211 V324 L278 373Z" fill="#293b3b"/><path d="M290 269 480 223 V314 L290 357Z" fill="#8dada9" opacity=".35"/><path d="M310 257 V354" stroke="#e5d7bf" stroke-width="6"/><path d="M350 257 V354" stroke="#e5d7bf" stroke-width="6"/><path d="M390 257 V354" stroke="#e5d7bf" stroke-width="6"/><path d="M430 257 V354" stroke="#e5d7bf" stroke-width="6"/><path d="M470 257 V354" stroke="#e5d7bf" stroke-width="6"/><path d="M110 190 235 249 V351 L110 294Z" fill="#293b3b"/><path d="M0 422 230 382 340 460 H0Z" fill="#eee7d8" opacity=".6"/><path d="M555 370V198" stroke="#59634d" stroke-width="9"/><ellipse cx="553" cy="188" rx="39" ry="76" fill="#68745b"/><ellipse cx="45" cy="318" rx="55" ry="19" fill="#778265"/></svg><rect x="48" y="750" width="220" height="48" fill="#c7ee54" rx="0"/><text x="66" y="781" font-family="Arial" font-size="14" fill="#242824" >Unsere Projekte entdecken ↗</text><text x="48" y="889" font-family="Arial" font-size="27" fill="#242824" >01 / Durchdacht bis ins Detail</text><text x="48" y="932" font-family="Arial" font-size="17" fill="#242824" >Vom ersten Gespräch bis zum fertigen Raum begleiten wir dein Vorhaben.</text><rect x="48" y="974" width="904" height="1" fill="#bec3b9" rx="0"/><text x="48" y="1013" font-family="Arial" font-size="13" fill="#242824" >NEUBAU</text><text x="350" y="1013" font-family="Arial" font-size="13" fill="#242824" >UMBAU</text><text x="650" y="1013" font-family="Arial" font-size="13" fill="#242824" >INNENRÄUME</text></svg>