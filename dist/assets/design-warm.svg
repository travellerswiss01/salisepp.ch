<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060"><rect width="1000" height="1060" fill="#fbf5ee"/><text x="48" y="58" font-family="Georgia" font-size="34" fill="#693c32" >raumwerk</text><text x="615" y="55" font-family="Arial" font-size="14" fill="#693c32" >Unser Atelier     Projekte     Lass uns reden</text><text x="48" y="151" font-family="Arial" font-size="12" fill="#a45c42" letter-spacing="2">GUTE RÄUME. GUTE GESPRÄCHE.</text><text x="48" y="230" font-family="Georgia" font-size="67" fill="#693c32" >Hier beginnt</text><text x="48" y="306" font-family="Georgia" font-size="67" fill="#693c32" >dein Zuhause</text><text x="48" y="366" font-family="Arial" font-size="19" fill="#693c32" >Ein Ort, der sich nach dir anfühlt.</text><text x="48" y="396" font-family="Arial" font-size="17" fill="#693c32" >Mit Zeit zum Zuhören und Liebe zum Detail.</text><rect x="48" y="438" width="211" height="52" fill="#a5533d" rx="26"/><text x="72" y="471" font-family="Arial" font-size="15" fill="#fff" >Lernen wir uns kennen ↗</text><defs><clipPath id="arch"><path d="M550 490V280 A190 190 0 0 1 930 280V490Z"/></clipPath></defs><g clip-path="url(#arch)"><svg x="550" y="80" width="380" height="410" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid slice"><rect x="0" y="0" width="600" height="460" fill="#e6d9cc" rx="0"/><circle cx="465" cy="95" r="44" fill="#fff" opacity=".45"/><path d="M0 310 Q180 200 320 330 T600 300 V460 H0Z" fill="#c9bb9e"/><path d="M95 170 365 112 520 182 255 246Z" fill="#f1dfc8"/><path d="M95 170 255 246 V397 L95 319Z" fill="#d1b597"/><path d="M255 246 520 182 V342 L255 397Z" fill="#f1dfc8"/><path d="M278 263 491 211 V324 L278 373Z" fill="#594b3e"/><path d="M290 269 480 223 V314 L290 357Z" fill="#8dada9" opacity=".35"/><path d="M310 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M350 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M390 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M430 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M470 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M110 190 235 249 V351 L110 294Z" fill="#594b3e"/><path d="M0 422 230 382 340 460 H0Z" fill="#eee7d8" opacity=".6"/><path d="M555 370V198" stroke="#59634d" stroke-width="9"/><ellipse cx="553" cy="188" rx="39" ry="76" fill="#68745b"/><ellipse cx="45" cy="318" rx="55" ry="19" fill="#778265"/></svg></g><rect x="0" y="550" width="1000" height="510" fill="#f0e2d5" rx="0"/><text x="60" y="624" font-family="Georgia" font-size="47" fill="#693c32" >«Ein Zuhause ist mehr</text><text x="60" y="682" font-family="Georgia" font-size="47" fill="#693c32" >als ein schöner Grundriss»</text><text x="64" y="740" font-family="Arial" font-size="18" fill="#693c32" >Wir sind ein kleines Atelier mit einer grossen Freude an guten Räumen.</text><svg x="64" y="785" width="330" height="210" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid slice"><rect x="0" y="0" width="600" height="460" fill="#e6d9cc" rx="0"/><circle cx="465" cy="95" r="44" fill="#fff" opacity=".45"/><path d="M0 310 Q180 200 320 330 T600 300 V460 H0Z" fill="#c9bb9e"/><path d="M95 170 365 112 520 182 255 246Z" fill="#f1dfc8"/><path d="M95 170 255 246 V397 L95 319Z" fill="#d1b597"/><path d="M255 246 520 182 V342 L255 397Z" fill="#f1dfc8"/><path d="M278 263 491 211 V324 L278 373Z" fill="#594b3e"/><path d="M290 269 480 223 V314 L290 357Z" fill="#8dada9" opacity=".35"/><path d="M310 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M350 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M390 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M430 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M470 257 V354" stroke="#f1dfc8" stroke-width="6"/><path d="M110 190 235 249 V351 L110 294Z" fill="#594b3e"/><path d="M0 422 230 382 340 460 H0Z" fill="#eee7d8" opacity=".6"/><path d="M555 370V198" stroke="#59634d" stroke-width="9"/><ellipse cx="553" cy="188" rx="39" ry="76" fill="#68745b"/><ellipse cx="45" cy="318" rx="55" ry="19" fill="#778265"/></svg><text x="440" y="827" font-family="Georgia" font-size="29" fill="#693c32" >Persönlich von Anfang an</text><text x="440" y="872" font-family="Arial" font-size="17" fill="#693c32" >Deine Ideen sind unser Ausgangspunkt.</text><text x="440" y="905" font-family="Arial" font-size="17" fill="#693c32" >Gemeinsam machen wir daraus einen Ort,</text><text x="440" y="938" font-family="Arial" font-size="17" fill="#693c32" >an dem du gerne ankommst.</text></svg>